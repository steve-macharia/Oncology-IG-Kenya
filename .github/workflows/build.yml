name: Build and Deploy FHIR IG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo with submodules if any
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 🔁 Initialize submodules (if any)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive
          else
            echo "⚠️ .gitmodules not found. Skipping submodule init."
          fi

      # Set up environments
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🟩 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 💎 Set up Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Cache dependencies
      - name: 💾 Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 💾 Cache Ruby gems
        if: hashFiles('**/Gemfile.lock') != ''
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # Install tooling
      - name: 📦 Install SUSHI globally
        run: |
          npm install -g fsh-sushi
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: 💎 Install Jekyll and Bundler
        run: gem install jekyll bundler

      # Verify versions
      - name: ✅ Verify tool versions
        run: |
          java -version
          node -v
          sushi --version
          jekyll --version

      # Download IG Publisher
      - name: ⬇️ Download IG Publisher
        run: |
          mkdir -p input-cache
          wget -q -O input-cache/org.hl7.fhir.publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      # Run SUSHI
      - name: 🧪 Run SUSHI manually
        run: sushi .

      # Run IG Publisher
      - name: 🛠️ Run IG Publisher
        run: |
          java -jar input-cache/org.hl7.fhir.publisher.jar \
            -ig . -no-sushi -tx https://tx.fhir.org/r4

      # Debug output
      - name: 🔍 Check output folder contents
        run: |
          echo "📁 Contents of ./output:"
          ls -l ./output || echo "⚠️ ./output directory does not exist!"

      # Ensure output exists
      - name: 🧪 Validate output directory
        run: |
          if [ ! -d "./output" ]; then
            echo "❌ ERROR: ./output directory does not exist."
            exit 1
          fi

      # Upload artifact for GitHub Pages
      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
